<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>족발타임 - 직원 관리 시스템</title>
    
    <!-- CSS 연결 -->
    <link rel="stylesheet" href="./style.css">

    <!-- QR 코드 스캐너 라이브러리 (카메라 스캔 필수) -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <header class="header">
        <h1>JOKBAL TIME STAFF</h1>
        <p class="subtitle">직원 전용 쿠폰 승인 및 조회 시스템</p>
    </header>

    <main class="staff">

        <!-- 1. 로그인 영역 -->
        <section id="loginArea" class="store-item">
            <h2 style="color: var(--gold); margin-bottom: 15px;">직원 로그인</h2>
            <div style="display: flex; flex-direction: column; gap: 10px; max-width: 320px; margin: auto;">
                <input type="email" id="email" placeholder="직원 이메일" style="padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff;">
                <input type="password" id="password" placeholder="비밀번호" style="padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff;">
                <button id="loginButton" class="staff-btn" style="margin-top: 10px;">로그인</button>
            </div>
        </section>

        <!-- 2. 직원 전용 메인 영역 (로그인 완료 시 표시) -->
        <section id="staffArea" style="display: none;">
            
            <!-- 상단 로그아웃 버튼 -->
            <div style="text-align: right; margin-bottom: 20px;">
                <button id="logoutButton" style="background: #333; color: #ccc; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer;">로그아웃</button>
            </div>

            <!-- 실시간 고객 사용 요청 목록 -->
            <div class="section-title">
                <h2>🔔 실시간 요청 목록</h2>
                <p>고객이 현장에서 요청한 쿠폰입니다.</p>
            </div>
            
            <div id="requestList" style="margin-bottom: 40px;">
                <!-- staff.js에서 실시간으로 생성됨 -->
            </div>

            <hr style="border: 0; border-top: 1px dashed rgba(212,175,55,0.3); margin: 30px 0;">

            <!-- 쿠폰 직접 확인 및 QR 스캔 -->
            <div class="section-title">
                <h2>📷 쿠폰 직접 확인 및 스캔</h2>
            </div>

            <div class="store-item" style="max-width: 400px; margin: auto;">
                <!-- 카메라 화면 출력 영역 -->
                <div id="reader"></div>

                <!-- 입력창 및 스캔 버튼 -->
                <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                    <input type="text" id="couponNumber" placeholder="쿠폰 번호 입력" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff;">
                    <button id="scanButton" style="background: var(--gold); color: #111; border: none; padding: 0 15px; border-radius: 8px; font-weight: bold; cursor: pointer;">📷 QR 스캔</button>
                </div>

                <!-- 승인/조회/취소 버튼 -->
                <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                    <button id="checkButton" style="flex: 1; padding: 12px; background: #333; color: #fff; border: 1px solid var(--gold); border-radius: 8px; cursor: pointer;">조회</button>
                    <button id="useButton" style="flex: 1; padding: 12px; background: #2e7d32; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">✅ 사용 완료</button>
                    <button id="cancelButton" style="flex: 1; padding: 12px; background: #c62828; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">♻️ 취소</button>
                </div>

                <!-- 결과 메시지 출력 -->
                <div id="result" style="font-size: 16px; font-weight: bold; margin-top: 10px; min-height: 24px;"></div>
            </div>
<hr style="border:0;border-top:1px dashed rgba(212,175,55,0.3);margin:30px 0;">


<div class="section-title">
    <h2>📜 쿠폰 처리 기록</h2>
    <p>사용 완료 및 취소 기록</p>
</div>


<div id="historyList" class="store-item">

</div>

        </section>

    </main>

    <!-- 스크립트 연결 (Module 방식) -->
    <script type="module" src="./staff.js"></script>
</body>
</html>
