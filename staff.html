<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
족발타임 직원 쿠폰 관리
</title>


<style>


*{

box-sizing:border-box;

}



body{

margin:0;

background:#111;

font-family:
Arial,
"Noto Sans KR",
sans-serif;

color:white;

}



.container{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}



.staff-box{

width:100%;

max-width:450px;

background:#222;

border-radius:20px;

padding:30px;

text-align:center;

box-shadow:
0 10px 30px rgba(0,0,0,.5);

}



.logo{

font-size:40px;

}



h1{

font-size:26px;

margin:20px 0;

}





input{

width:100%;

height:55px;

border-radius:12px;

border:none;

font-size:18px;

text-align:center;

margin-bottom:15px;

}





button{

width:100%;

height:55px;

border:none;

border-radius:12px;

font-size:18px;

font-weight:bold;

cursor:pointer;

margin-top:10px;

}



#checkButton{

background:white;

color:#111;

}



#useButton{

background:#c62828;

color:white;

}



#cancelButton{

background:#555;

color:white;

}





#result{

margin-top:25px;

background:#000;

padding:20px;

border-radius:12px;

font-size:20px;

line-height:1.6;

}






#requestList{

margin-top:25px;

}




.request-box{

background:#333;

padding:20px;

border-radius:15px;

margin-bottom:15px;

}



.request-box h2{

margin-top:0;

}



.request-box button{

background:#D4AF37;

color:#111;

}





.notice{

margin-top:20px;

font-size:14px;

color:#aaa;

}



</style>


</head>



<body>


<div class="container">


<div class="staff-box">



<div class="logo">

🍖

</div>




<h1>

족발타임<br>

직원 쿠폰 확인

</h1>





<input

id="couponNumber"

placeholder="쿠폰번호 입력">





<button

id="checkButton">

🔎 쿠폰 확인

</button>





<button

id="useButton">

✅ 사용 완료

</button>





<button

id="cancelButton">

♻️ 사용 취소

</button>






<div id="result">

쿠폰번호를 입력하세요

</div>





<!-- 고객 요청 표시 -->

<div id="requestList">

</div>





<div class="notice">

고객 요청이 실시간으로 표시됩니다.

</div>




</div>


</div>





<script

type="module"

src="staff.js">

</script>



</body>

</html>
