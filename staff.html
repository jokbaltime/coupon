<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
족발타임 직원 쿠폰 확인
</title>


<style>


*{

box-sizing:border-box;

}



body{

margin:0;

background:#111;

font-family:
Arial,
sans-serif;

color:white;

}



.container{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}



.staff-box{

width:100%;

max-width:420px;

background:#222;

border-radius:20px;

padding:30px;

text-align:center;

box-shadow:
0 10px 30px rgba(0,0,0,.5);

}



.logo{

font-size:32px;

margin-bottom:10px;

}



h1{

font-size:26px;

margin-bottom:30px;

}



input{

width:100%;

height:60px;

font-size:20px;

text-align:center;

border-radius:12px;

border:none;

margin-bottom:20px;

}



button{

width:100%;

height:55px;

border:none;

border-radius:12px;

font-size:20px;

font-weight:bold;

margin-top:12px;

cursor:pointer;

}



#checkButton{

background:#fff;

color:#111;

}



#useButton{

background:#c62828;

color:white;

}



#cancelButton{

background:#555;

color:white;

}



#result{

margin-top:30px;

padding:20px;

border-radius:12px;

background:#000;

font-size:22px;

min-height:70px;

display:flex;

align-items:center;

justify-content:center;

}



.notice{

margin-top:20px;

color:#aaa;

font-size:14px;

}


</style>


</head>




<body>


<div class="container">


<div class="staff-box">


<div class="logo">
🍖
</div>



<h1>
족발타임<br>
직원 쿠폰 확인
</h1>



<input

id="couponNumber"

placeholder="쿠폰번호 입력">





<button
id="checkButton">

🔎 사용 확인

</button>





<button
id="useButton">

✅ 사용 완료

</button>





<button
id="cancelButton">

♻️ 사용 취소

</button>






<div id="result">

쿠폰번호를 입력하세요

</div>




<div class="notice">

결제 전 반드시 쿠폰 상태를 확인하세요.

</div>




</div>


</div>





<script
type="module"
src="staff.js">
</script>



</body>

</html>
