<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
JOKBAL TIME STAFF
</title>


<link rel="stylesheet" href="./style.css">


<script src="https://unpkg.com/html5-qrcode"></script>


</head>



<body>


<header class="header">

<h1>
JOKBAL TIME STAFF
</h1>


<p class="subtitle">
직원 전용 쿠폰 승인 및 사용 관리
</p>


</header>






<main class="staff">







<section

id="loginArea"

class="store-item"

>



<h2 style="color:#D4AF37;">
직원 로그인
</h2>




<input

id="email"

type="email"

placeholder="직원 이메일"

>




<input

id="password"

type="password"

placeholder="비밀번호"

>




<button

id="loginButton"

class="staff-btn"

>

로그인

</button>



</section>










<section

id="staffArea"

style="display:none;"

>





<button

id="logoutButton"

class="staff-btn"

>

로그아웃

</button>








<section class="store-item">


<h2 style="color:#D4AF37;">

🔔 쿠폰 승인 요청

</h2>




<div

id="requestList"

>

</div>



</section>









<section class="store-item">


<h2 style="color:#D4AF37;">

쿠폰 확인

</h2>





<div id="reader">

</div>






<input

id="couponNumber"

type="text"

placeholder="쿠폰번호 입력"

>







<div>


<button

id="checkButton"

class="staff-btn"

>

조회

</button>




<button

id="useButton"

class="staff-btn"

>

사용 완료

</button>


</div>






<div

id="result"

>

</div>



</section>







</section>




</main>







<script

type="module"

src="./staff.js"

>

</script>



</body>


</html>
