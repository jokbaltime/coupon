<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
족발타임 직원 관리
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:#111;

color:white;

font-family:
Arial,
"Noto Sans KR",
sans-serif;

}


.container{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}


.box{

width:100%;

max-width:450px;

background:#222;

padding:30px;

border-radius:20px;

text-align:center;

}



.logo{

font-size:40px;

}


h1{

margin:20px 0;

}



input{

width:100%;

height:55px;

margin-bottom:15px;

border-radius:12px;

border:none;

padding:10px;

font-size:17px;

}



button{

width:100%;

height:55px;

border:none;

border-radius:12px;

font-size:18px;

font-weight:bold;

margin-top:10px;

cursor:pointer;

}



#loginButton{

background:#D4AF37;

}



#logoutButton{

background:#555;

color:white;

}



#staffArea{

display:none;

}



.action{

background:white;

color:#111;

}



.danger{

background:#c62828;

color:white;

}



#result{

margin-top:20px;

background:#000;

padding:20px;

border-radius:12px;

}



#requestList{

margin-top:20px;

}



.request-box{

background:#333;

padding:20px;

border-radius:15px;

margin-bottom:15px;

}
#reader{

width:100%;

max-width:350px;

margin:20px auto;

background:#000;

padding:10px;

border-radius:12px;

display:none;

overflow:hidden;

}

</style>

</head>



<body>


<div class="container">


<div class="box">



<div class="logo">
🍖
</div>


<h1>
족발타임<br>
직원 시스템
</h1>




<!-- 로그인 -->

<div id="loginArea">


<input

id="email"

placeholder="직원 이메일">


<input

id="password"

type="password"

placeholder="비밀번호">



<button id="loginButton">

직원 로그인

</button>



</div>






<!-- 직원 영역 -->

<div id="staffArea">



<h2>
쿠폰 관리
</h2>



<button

id="logoutButton">

로그아웃

</button>





<input

id="couponNumber"

placeholder="쿠폰번호 입력">





<button

id="checkButton"

class="action">

🔎 쿠폰 확인

</button>

<button

id="scanButton"

class="action">

📷 QR 스캔

</button>


<button

id="useButton"

class="danger">

✅ 사용 완료

</button>





<button

id="cancelButton">

♻️ 사용 취소

</button>





<div id="result">

대기중

</div>

<div id="reader"></div>


<div id="requestList">

</div>



</div>



</div>

</div>






<script src="https://unpkg.com/@zxing/library@latest"></script>

<script
type="module"
src="staff.js">
</script>


</body>

</html>
