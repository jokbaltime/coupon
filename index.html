<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>족발타임 - 쿠폰 & 메뉴</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
    }
    body {
      background-color: #121212;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #1e1e1e;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid #333;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      color: #d4af37;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .header p {
      color: #aaa;
      font-size: 14px;
      margin-top: 6px;
    }

    /* 쿠폰 입력 영역 */
    .coupon-card {
      background: #2a2a2a;
      border: 1px solid #d4af37;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 28px;
      text-align: center;
    }
    .coupon-card h2 {
      font-size: 18px;
      color: #fff;
      margin-bottom: 12px;
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    .input-group input {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #121212;
      color: #fff;
      font-size: 16px;
      text-transform: uppercase;
      text-align: center;
      letter-spacing: 1px;
    }
    .input-group input:focus {
      outline: none;
      border-color: #d4af37;
    }
    .btn-submit {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      background: linear-gradient(135deg, #d4af37, #aa820a);
      color: #111;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:active {
      opacity: 0.9;
    }

    /* 메뉴 영역 */
    .menu-title {
      font-size: 18px;
      color: #d4af37;
      margin-bottom: 16px;
      border-left: 4px solid #d4af37;
      padding-left: 8px;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .menu-item {
      background: #2a2a2a;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #333;
      text-align: center;
    }
    .menu-item img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
    }
    .menu-item .name {
      padding: 10px 6px;
      font-size: 15px;
      font-weight: 600;
      color: #eee;
    }

    /* 푸터 */
    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 헤더 -->
  <div class="header">
    <h1>족발타임 JOKBAL TIME</h1>
    <p>모바일 쿠폰 확인 및 매장 승인 요청</p>
  </div>

  <!-- 쿠폰 번호 입력 카드 -->
  <div class="coupon-card">
    <h2>🎟️ 쿠폰 번호 입력</h2>
    <input type="text" id="couponInput" placeholder="예: JT-260726-2031" maxlength="20">
    <button class="btn-submit" onclick="goToCustomerPage()">쿠폰 조회하기</button>
  </div>

  <!-- 리뉴얼 대표 메뉴 -->
  <div class="menu-title">대표 메뉴 안내</div>
  <div class="menu-grid">
    <div class="menu-item">
      <img src="menu1.jpg" alt="족발" onerror="this.src='https://via.placeholder.com/200x120?text=족발'">
      <div class="name">족발</div>
    </div>
    <div class="menu-item">
      <img src="menu2.jpg" alt="반반족발" onerror="this.src='https://via.placeholder.com/200x120?text=반반족발'">
      <div class="name">반반족발</div>
    </div>
    <div class="menu-item">
      <img src="menu3.jpg" alt="냉채족발" onerror="this.src='https://via.placeholder.com/200x120?text=냉채족발'">
      <div class="name">냉채족발</div>
    </div>
    <div class="menu-item">
      <img src="menu4.jpg" alt="족보세트" onerror="this.src='https://via.placeholder.com/200x120?text=족보세트'">
      <div class="name">족보세트</div>
    </div>
  </div>

  <!-- 푸터 -->
  <div class="footer">
    © JOKBAL TIME. All rights reserved.
  </div>
</div>

<script>
  function goToCustomerPage() {
    const input = document.getElementById("couponInput");
    const num = input.value.trim();

    if (!num) {
      alert("쿠폰 번호를 입력해 주세요.");
      return;
    }

    // 로컬스토리지 저장 및 URL 파라미터를 넘기며 customer.html로 이동
    localStorage.setItem("JT_COUPON_NUMBER", num);
    window.location.href = `./customer.html?coupon=${encodeURIComponent(num)}&v=2.0`;
  }

  // 엔터키 누르면 바로 조회 실행
  document.getElementById("couponInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
      goToCustomerPage();
    }
  });
</script>

</body>
</html>
