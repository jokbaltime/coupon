<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOKBAL TIME - 족발타임 프리미엄 쿠폰</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <!-- ========================= -->
  <!-- HERO SECTION -->
  <!-- ========================= -->
  <section class="hero">
    <img src="./images/hero.jpg" id="heroImage" class="heroImage" alt="대표메뉴">
    
    <div class="heroText">
      <img src="./images/logo.png" class="heroLogo" alt="족발타임 로고">
      <h1>🍖 JOKBAL TIME</h1>
      <p>오늘도 맛있는 족발</p>
      <a href="#couponSection" class="heroBtn">🎁 쿠폰 보기</a>
    </div>
  </section>

  <!-- ========================= -->
  <!-- BEST MENU SECTION -->
  <!-- ========================= -->
  <section class="bestMenu">
    <h2>🔥 BEST MENU</h2>
    <div class="menuGrid">
      <div class="menuCard">
        <img src="./images/menu1.jpg" alt="앞다리 족발">
        <h3>앞다리 족발</h3>
        <p>대표 인기 메뉴</p>
      </div>
      <div class="menuCard">
        <img src="./images/menu2.jpg" alt="반반세트">
        <h3>반반세트</h3>
        <p>족발 + 보쌈</p>
      </div>
      <div class="menuCard">
        <img src="./images/menu3.jpg" alt="쟁반막국수">
        <h3>쟁반막국수</h3>
        <p>시원한 별미</p>
      </div>
      <div class="menuCard">
        <img src="./images/menu4.jpg" alt="불족발">
        <h3>불족발</h3>
        <p>매콤한 인기 메뉴</p>
      </div>
    </div>
  </section>

  <!-- ========================= -->
  <!-- SERVICE LINK SECTION -->
  <!-- ========================= -->
  <section id="couponSection" class="box">
    <h2>쿠폰 서비스</h2>
    <p>고객 쿠폰 확인 및 사용</p>
    <a href="./customer.html">
      <button>쿠폰 사용하기</button>
    </a>
  </section>

  <section class="box">
    <h2>관리 페이지</h2>
    <p>매장 직원 및 관리자 전용</p>
    <a href="./admin.html">
      <button>관리자 페이지</button>
    </a>
  </section>

  <!-- ========================= -->
  <!-- FOOTER -->
  <!-- ========================= -->
  <footer>
    <p>© JOKBAL TIME. All rights reserved.</p>
  </footer>

</body>

</html>
