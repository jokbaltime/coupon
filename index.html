<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>족발타임 할인권</title>
<style>
body{
    margin:0;
    background:#f6f6f6;
    font-family:'Malgun Gothic',sans-serif;
}
.card{
    max-width:420px;
    margin:30px auto;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}
.logo{
    width:180px;
    margin:25px auto 10px;
    display:block;
}
.title{
    background:#b30000;
    color:#fff;
    font-size:34px;
    font-weight:bold;
    text-align:center;
    padding:18px;
}
.subtitle{
    text-align:center;
    font-size:20px;
    margin:25px;
    color:#444;
}
.notice{
    margin:20px;
    padding:18px;
    background:#fff4e5;
    border-radius:12px;
    text-align:center;
    font-size:18px;
}
.button{
    margin:25px;
    background:#ffcc00;
    color:#000;
    font-size:22px;
    text-align:center;
    padding:18px;
    border-radius:12px;
    font-weight:bold;
}
.footer{
    text-align:center;
    color:#888;
    padding-bottom:25px;
}
</style>
</head>
<body>

<div class="card">

<img class="logo" src="logo.png">

<div class="title">
메인메뉴 20% 할인권
</div>

<div class="subtitle">
🐷 족발타임 방문을 환영합니다.
</div>

<div class="notice">
✔ 매장 내 주문만 가능<br>
✔ 포장 · 배달 제외
</div>

<div class="button">
직원에게 본 화면을 제시해주세요.
</div>

<div class="footer">
Coupon No.<br>
JT-2026-000001
</div>

</div>

</body>
</html>
