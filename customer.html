<!DOCTYPE html>

<html lang="ko">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
족발타임 쿠폰
</title>


<link rel="stylesheet" href="./style.css">


</head>



<body>



<header class="header">


<h1>
🍖 JOKBAL TIME
</h1>


<p>
프리미엄 쿠폰 사용
</p>


</header>







<section class="coupon-page">





<div class="slider">


<img

id="mainImage"

src=""

alt="쿠폰 이미지"

>


</div>








<div class="coupon-box">


<h2 id="couponTitle">

쿠폰 확인

</h2>



<div class="discount">


<span id="discount">

0%

</span>

할인

</div>





<p id="notice">

쿠폰번호를 입력해주세요.

</p>







<input

id="couponNumber"

placeholder="쿠폰번호 입력"

autocomplete="off"

>







<button

id="requestBtn"

>

사용 승인 요청

</button>






<div

id="result"

>

</div>





</div>





</section>







<script

type="module"

src="./customer.js">

</script>



</body>


</html>
