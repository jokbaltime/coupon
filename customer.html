     JOKBAL TIME COUPON CUSTOMER
     ====================================== -->


<!DOCTYPE html>

<html lang="ko">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
족발타임 쿠폰
</title>


<link rel="stylesheet" href="./style.css">


</head>



<body>



<header class="header">


<h1>
🍖 JOKBAL TIME
</h1>


<p>
프리미엄 쿠폰 사용
</p>


</header>







<section class="coupon-page">





<div class="slider">


<img

id="mainImage"

src=""

alt="쿠폰 이미지"

>


</div>



<div class="coupon-box">


<div class="coupon-brand">

🍖 JOKBAL TIME

</div>



<h2 id="couponTitle">

쿠폰 확인

</h2>




<div class="discount-box">


<span id="discount">

0%

</span>


<p>
할인 쿠폰
</p>


</div>





<div id="result" class="status-box">

쿠폰 상태 확인 중

</div>






<div class="coupon-info">


<p id="notice">

쿠폰번호를 입력해주세요.

</p>



<input

id="couponNumber"

placeholder="쿠폰번호 입력"

autocomplete="off"

>



<button

id="requestBtn"

>

쿠폰 확인하기

</button>



</div>





<div class="qr-title">

직원에게 QR을 보여주세요

</div>



<div id="qrcode" class="qr-box"></div>





<div class="store-info">


<p>
📍 족발타임 매장
</p>


<p>
☎ 전화 문의
</p>


</div>




</div>










</section>




<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script

type="module"

src="./customer.js">

</script>



</body>


</html>
