<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
족발타임 관리자
</title>


<link rel="stylesheet"
href="admin.css">


</head>


<body>


<div class="admin-wrap">



<!-- 로그인 -->

<section class="admin-card login-box">


<h1>
🍖 족발타임 관리자
</h1>


<p>
관리자 PIN 입력
</p>


<input
id="adminEmail"
type="email"
placeholder="관리자 이메일">


<input
id="adminPassword"
type="password"
placeholder="비밀번호">



<button id="loginButton">

로그인

</button>



</section>







<!-- 관리자 화면 -->

<section

id="adminPanel"

class="admin-card hidden">



<h2>
쿠폰 설정
</h2>




<label>
쿠폰 제목
</label>


<input
id="title"
value="메인메뉴">





<label>
할인율
</label>


<input

id="discount"

type="number"

value="20">





<label>
안내문구
</label>


<textarea

id="notice">

매장 내 식사만 가능

</textarea>





<button

id="saveButton">

저장

</button>




<hr>





<h2>
사용 관리
</h2>



<p>
직원 페이지에서 처리하세요.
</p>


<a href="staff.html">

직원 쿠폰 확인 이동

</a>



</section>




</div>




<script

type="module"

src="admin.js">

</script>



</body>

</html>
