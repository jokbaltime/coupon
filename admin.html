<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
족발타임 관리자
</title>


<link rel="stylesheet"
href="admin.css">


</head>


<body>


<div class="admin-container">



<!-- 로그인 -->

<div class="login-box">


<h1>
족발타임 관리자
</h1>


<p>
관리자 PIN 입력
</p>


<input
type="password"
id="adminPin"
placeholder="PIN 입력">


<button
id="loginButton">

로그인

</button>


</div>








<!-- 관리자 영역 -->


<div id="adminPanel"
class="hidden">





<h1>
족발타임 관리자
</h1>






<!-- 쿠폰 설정 -->


<section class="card">


<h2>
🎟 쿠폰 설정
</h2>



<label>
쿠폰 제목
</label>


<input
id="title"
value="메인메뉴">





<label>
할인율
</label>


<input
id="discount"
type="number"
value="20">





<label>
안내 문구
</label>


<textarea
id="notice">

매장 내 식사만 가능
포장 · 배달 제외

</textarea>




<button
id="saveButton">

저장하기

</button>



</section>








<!-- 직원 쿠폰 확인 -->


<section class="card">


<h2>
👨‍🍳 직원 쿠폰 확인
</h2>




<input
id="useCouponNumber"
placeholder="JT-260724-1234">





<div class="button-group">


<button
id="checkUseButton">

사용 확인

</button>



<button
id="completeUseButton">

사용 완료

</button>



<button
id="cancelUseButton">

사용 취소

</button>


</div>




<p
id="useResult">

</p>



</section>









<!-- 최근 쿠폰 목록 -->


<section class="card">


<h2>
📋 최근 발급 쿠폰
</h2>


<div
id="couponList">

불러오는 중...

</div>



</section>






</div>


</div>






<script
type="module"
src="admin.js">

</script>


</body>

</html>
