<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
JOKBAL TIME ADMIN
</title>


<link rel="stylesheet" href="./admin.css">


</head>



<body>



<div class="admin-wrap">





<section

class="admin-card login-box"

>


<h1>
🍖 족발타임 관리자
</h1>



<p>
관리자 로그인
</p>





<input

id="adminEmail"

type="email"

placeholder="관리자 이메일"

>





<input

id="adminPassword"

type="password"

placeholder="비밀번호"

>





<button

id="loginButton"

>

로그인

</button>



</section>









<section

id="adminPanel"

class="admin-card hidden"

>



<h1>
🍖 쿠폰 관리자
</h1>





<h2>
쿠폰 설정
</h2>





<label>
쿠폰 제목
</label>


<input

id="title"

type="text"

>




<label>
할인율
</label>


<input

id="discount"

type="number"

value="0"

>






<label>
안내 문구
</label>



<textarea

id="notice"

></textarea>







<button

id="saveButton"

>

저장

</button>







<hr>







<h2>
쿠폰 현황
</h2>



<div

id="adminStats"

>

불러오는 중...

</div>






<hr>





<h2>
처리 기록
</h2>



<div

id="adminHistory"

>

</div>








<button

id="logoutButton"

>

로그아웃

</button>





</section>






</div>







<script

type="module"

src="./admin.js"

>

</script>




</body>


</html>
