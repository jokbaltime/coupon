<!-- ======================================
     admin.html
     JOKBAL TIME COUPON ADMIN
     ====================================== -->

<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
족발타임 관리자
</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<link rel="stylesheet"
href="./admin.css">

</head>

<body>

<div class="admin-container">

<h1>
🍖 족발타임 관리자
</h1>

<!-- ============================= -->
<!-- ADMIN -->
<!-- ============================= -->

<section
id="adminBox"
class="box">

<div class="top">

<h2>
쿠폰 관리
</h2>

<button
id="logoutBtn">

로그아웃

</button>

</div>

<hr>

<h2>
📊 오늘 통계
</h2>

<div id="dashboard">

<p>
발급 :
<span id="totalCoupon">0</span>
</p>

<p>
승인대기 :
<span id="waitingCount">0</span>
</p>

<p>
승인완료 :
<span id="approvedCount">0</span>
</p>

<p>
사용완료 :
<span id="usedCount">0</span>
</p>

<p>
기간만료 :
<span id="expiredCount">0</span>
</p>

<p>
오늘 발급 :
<span id="todayIssued">0</span>
</p>

<p>
오늘 사용 :
<span id="todayUsed">0</span>
</p>

</div>

<hr>

<div id="couponEditSection">

<h3>

쿠폰 생성 / 수정

</h3>

<input
id="couponNumber"
placeholder="쿠폰번호">

<input
id="couponTitle"
placeholder="쿠폰명">

<input
id="discount"
type="number"
placeholder="할인율 (%)">

<input
id="maxUseCount"
type="number"
value="1"
placeholder="최대 사용 횟수">

<textarea
id="notice"
placeholder="안내 문구">
</textarea>

<input
id="imageUrl"
placeholder="쿠폰 이미지 주소">

<label>
사용 시작일
</label>

<input
type="date"
id="startDate">

<label>
사용 종료일
</label>

<input
type="date"
id="endDate">

<button
id="saveCouponBtn">

쿠폰 저장

</button>

<label style="display:flex; align-items:center; gap:8px; margin-top:12px; font-size:14px; color:#ccc; cursor:pointer;">
<input type="checkbox" id="setAsTemplate" style="width:auto; margin:0;">
이 쿠폰을 "대표 쿠폰(자동발급 기준)"으로 지정
</label>

<p id="templateStatus" style="margin-top:10px; font-size:13px; color:#D4AF37;"></p>

</div>

<hr>

<!-- ============================= -->
<!-- 승인 요청 -->
<!-- ============================= -->

<h3>
승인 요청 목록
</h3>

<div id="requestList">

</div>

<hr>

<!-- ==============================
대량 쿠폰 생성
============================== -->

<div class="bulk-coupon-box">

<h3>
대량 쿠폰 생성
</h3>

<label>
쿠폰명
</label>

<input
id="bulkCouponTitle"
type="text"
placeholder="족발 10% 할인">

<label>
할인율
</label>

<input
id="bulkDiscount"
type="number"
value="10">

<label>
생성 수량
</label>

<input
id="bulkCount"
type="number"
value="100">

<label>
시작일
</label>

<input
id="bulkStartDate"
type="date">

<label>
종료일
</label>

<input
id="bulkEndDate"
type="date">

<label>
공지
</label>

<textarea
id="bulkNotice"
placeholder="이벤트 안내">
</textarea>

<button id="bulkCreateBtn">
쿠폰 생성
</button>

</div>

<!-- ============================= -->
<!-- 쿠폰 조회 -->
<!-- ============================= -->

<h3>
쿠폰 조회 / 관리
</h3>

<a href="coupons.html" class="list-page-link">
📋 쿠폰 전체 목록 보기 (페이지별로)
</a>

<hr>

<input
id="searchCoupon"
placeholder="쿠폰번호 입력">

<button
type="button"
id="searchBtn">
조회
</button>

<button
id="scanQrBtn">
📷 QR 스캔
</button>

<input
id="searchTitle"
placeholder="쿠폰명 입력">

<button
type="button"
id="searchTitleBtn">
쿠폰명 검색
</button>

<div id="reader"></div>

<div id="couponResult">

</div>

<div id="editButtons" class="hidden">

<button id="editCouponBtn">

수정 모드

</button>

<button id="updateCouponBtn">

수정 저장

</button>

</div>

<br>

<button
id="useCouponBtn">

쿠폰 사용 처리

</button>

<button
id="deleteCouponBtn">
쿠폰 삭제
</button>

<button
id="cancelUseBtn">
사용 취소 복구
</button>

<hr>

<!-- ============================= -->
<!-- 처리 기록 -->
<!-- ============================= -->

<h3>
처리 기록
</h3>

<div id="historyList">

</div>

</section>

</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script

type="module"

src="./admin.js">

</script>

</body>

</html>
