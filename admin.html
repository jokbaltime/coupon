<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>족발타임 관리자</title>

<link rel="stylesheet" href="admin.css">

</head>


<body>


<!-- ==============================
     관리자 로그인
============================== -->

<div class="login-box">


    <h1>족발타임 관리자</h1>


    <p>
        관리자 PIN을 입력하세요.
    </p>


    <input

        type="password"

        id="adminPin"

        placeholder="PIN 입력"

    >



    <button id="loginButton">

        로그인

    </button>


</div>





<!-- ==============================
     관리자 패널
============================== -->


<div id="adminPanel" class="hidden">


<h2>
    쿠폰 설정
</h2>



<label>
    할인율
</label>


<input

    id="discount"

    value="20"

    type="number"

>




<label>
    쿠폰 제목
</label>


<input

    id="title"

    value="메인메뉴"

>




<label>
    안내문구
</label>


<textarea id="notice">


매장 내 식사만 가능

포장 · 배달 제외


</textarea>




<button id="saveButton">

저장하기

</button>

<hr>


<h2>
쿠폰 사용 관리
</h2>


<input
id="useCouponNumber"
placeholder="쿠폰번호 입력">


<button id="checkUseButton">

사용 확인

</button>


<button id="cancelUseButton">

사용 취소

</button>


<p id="useResult"></p>


<hr>




<!-- ==============================
     사용 쿠폰 확인
============================== -->


<h2>

사용 완료 쿠폰

</h2>



<div id="usedCoupons">


사용 기록 불러오는 중...

</div>



</div>





<script

type="module"

src="admin.js">

</script>



</body>

</html>
