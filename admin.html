<!-- ======================================
     admin.html
     JOKBAL TIME COUPON ADMIN
     ====================================== -->

<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
족발타임 관리자
</title>

<link rel="stylesheet"
href="./admin.css">

</head>

<body>

<div class="admin-container">

<h1>
🍖 족발타임 관리자
</h1>



<!-- ============================= -->
<!-- LOGIN -->
<!-- ============================= -->

<section
id="loginBox"
class="box">

<h2>
관리자 로그인
</h2>

<input
id="adminEmail"
type="email"
placeholder="관리자 이메일">

<input
id="adminPassword"
type="password"
placeholder="비밀번호">

<button
id="loginBtn">
로그인
</button>

</section>





<!-- ============================= -->
<!-- ADMIN -->
<!-- ============================= -->

<section
id="adminBox"
class="box hidden">

<div class="top">

<h2>
쿠폰 관리
</h2>

<button
id="logoutBtn">

로그아웃

</button>

</div>



<hr>

<h2>
📊 오늘 통계
</h2>

<div id="dashboard">

<p>
발급 :
<span id="totalCoupon">0</span>
</p>

<p>
승인대기 :
<span id="waitingCount">0</span>
</p>

<p>
승인완료 :
<span id="approvedCount">0</span>
</p>

<p>
사용완료 :
<span id="usedCount">0</span>
</p>

</div>

<hr>



<h3>

쿠폰 생성 / 수정

</h3>

<input
id="couponNumber"
placeholder="쿠폰번호">

<input
id="couponTitle"
placeholder="쿠폰명">

<input
id="discount"
type="number"
placeholder="할인율 (%)">

<input
id="maxUseCount"
type="number"
value="1"
placeholder="최대 사용 횟수">

<textarea
id="notice"
placeholder="안내 문구">
</textarea>

<input
id="imageUrl"
placeholder="쿠폰 이미지 주소">

<label>
사용 시작일
</label>

<input
type="date"
id="startDate">

<label>
사용 종료일
</label>

<input
type="date"
id="endDate">

<button
id="saveCouponBtn">

쿠폰 저장

</button>

<hr>

  <!-- ============================= -->
<!-- 승인 요청 -->
<!-- ============================= -->

<h3>
승인 요청 목록
</h3>

<div id="requestList">

</div>

<hr>



<!-- ============================= -->
<!-- 쿠폰 조회 -->
<!-- ============================= -->

<h3>
쿠폰 조회 / 관리
</h3>

<h3>
📋 쿠폰 목록
</h3>

<div class="coupon-filter">

<button id="allCouponBtn">
전체
</button>

<button id="waitingCouponBtn">
승인대기
</button>

<button id="approvedCouponBtn">
승인완료
</button>

<button id="usedCouponBtn">
사용완료
</button>

</div>
     
<div id="couponList">

</div>

<hr>
     
<input
id="searchCoupon"
placeholder="쿠폰번호 입력">

<button
id="searchBtn">
조회
</button>

<div id="couponResult">

</div>

<div id="editButtons" class="hidden">

<button id="editCouponBtn">

수정 모드

</button>

<button id="updateCouponBtn">

수정 저장

</button>

</div>
     
<br>

<button
id="deleteCouponBtn">
쿠폰 삭제
</button>

<button
id="cancelUseBtn">
사용 취소 복구
</button>

<hr>



<!-- ============================= -->
<!-- 처리 기록 -->
<!-- ============================= -->

<h3>
처리 기록
</h3>

<div id="historyList">

</div>

</section>

</div>

<script
type="module"
src="./admin.js">
</script>

</body>

</html>
